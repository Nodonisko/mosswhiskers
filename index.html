<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#729847" />
    <title>Mosswhisker Hollow</title>
  </head>
  <body>
    <main id="game" aria-label="Mosswhisker Hollow game world">
      <canvas id="world" aria-label="A lush pixel-art woodland clearing"></canvas>

      <section class="colony-banner" aria-label="Colony progress">
        <h1>Mosswhisker Hollow</h1>
        <div class="reputation-row">
          <span class="crest" aria-hidden="true">♣</span>
          <div class="reputation-track"><div class="reputation-fill"></div><span class="lock">◆</span></div>
          <span class="crest crest--right" aria-hidden="true">♣</span>
        </div>
      </section>

      <aside class="day-panel" aria-label="Time and map">
        <div class="clock-card">
          <div class="clock"><span class="sun-icon">☀</span><strong>8:10 AM</strong></div>
          <div class="season"><span>SUMMER</span><b>03</b></div>
        </div>
        <div class="coin-row"><strong>1000</strong><span class="coin">✦</span></div>
        <div class="minimap" aria-label="Woodland map">
          <i class="map-river"></i>
          <i class="map-road map-road--one"></i>
          <i class="map-road map-road--two"></i>
          <i class="map-tree t1"></i><i class="map-tree t2"></i><i class="map-tree t3"></i>
          <i class="map-tree t4"></i><i class="map-tree t5"></i><i class="map-tree t6"></i>
          <i class="map-home">⌂</i>
          <i class="map-player">▲</i>
        </div>
      </aside>

      <div class="letter-bubble" aria-label="You have new mail"><span>✉</span></div>
      <p class="controls" aria-label="Controls">WASD / ARROWS TO WANDER</p>
      <div class="screen-shade" aria-hidden="true"></div>
    </main>
    <script type="module" src="./src/game.ts"></script>
  </body>
</html>
